# --- HOME (PHASE 4) ---------------------------------------------------------
# 3 slot pertama gratis untuk semua pemain; slot 4-8 dibeli memakai uang
# (harga & jumlahnya diatur di config.yml pada blok "home").
#
# GUI memakai inventory chest standar + holder custom, jadi pemain Java dan
# Bedrock/Geyser sama-sama bisa memakai (klik kiri = teleport/pasang/ beli,
# klik kanan = hapus). Semua teks di bawah ini bisa diubah bebas.
#
# Placeholder yang tersedia: %home% %slot% %world% %coords% %price% %used%
#                            %slots% %max% %seconds% %label%
home:
