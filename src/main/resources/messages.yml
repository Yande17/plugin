  trend-rising: "naik"
  trend-stable: "stabil"
  gui-title: "&8&lSELL ITEMS"
  total-material: PAPER
  total-name: "&e&lTOTAL &8» &a%total%"
  total-lore:
    - "&7Nilai item di GUI: &a%total%"
    - "&7Jumlah item bisa dijual: &f%count%"
    - ""
    - "&7Masukkan item ke area atas,"
    - "&7lalu tekan tombol &aSELL&7."
  filler-material: GRAY_STAINED_GLASS_PANE
  filler-name: " "
  sell-button-material: LIME_CONCRETE
  sell-button-name: "&a&l✔ SELL"
  sell-button-lore:
    - "&7Klik untuk menjual semua item"
    - "&7yang punya harga di &fprices.yml&7."
  cancel-button-material: RED_CONCRETE
  cancel-button-name: "&f&l✕ CANCEL"
  cancel-button-lore:
  # Tombol keterangan di baris tombol GUI /sell (slot & material: gui/sell.yml).
  info-name: "&bInfo"
  info-lore:
    - "&7Masukkan item ke area atas."
    - "&7Item yang punya harga di &fprices.yml &7bisa dijual."
    - "&7Item tanpa harga tetap tersimpan di GUI."
    - "&7Klik untuk mengembalikan item"
    - "&7ke inventory Anda."
  disabled: "%prefix%&cFitur /sell sedang dinonaktifkan."
  no-items: "%prefix%&cTidak ada item yang bisa dijual di GUI."
  no-price: "%prefix%&eItem berikut tidak punya harga jadi tetap di GUI: &f%items%"
  partially-unsellable: "%prefix%&eItem tanpa harga tetap tersimpan di GUI: &f%items%"
  over-limit: "%prefix%&cTotal sekali jual melebihi batas &f%limit%&c."
  success: "%prefix%&aBerhasil menjual &f%items% &aitem &8(%stacks% stack)&a senilai &f%total%&a."
  actionbar: "&a+%total% &7| &f%items% item &7terjual"
  actionbar-partial: "&a+%total% &7| &f%items% item &7terjual &8(%skipped% item tanpa harga tetap di GUI)"
  items-returned: "%prefix%&7Item di GUI dikembalikan ke inventory Anda &8(%amount% item)&7."
  cancelled: "%prefix%&7Dibatalkan. &f%amount% &7item dikembalikan ke inventory Anda."
  cancelled-empty: "%prefix%&7Penjualan dibatalkan &8(GUI kosong)&7."
  no-space: "%prefix%&cArea item di GUI penuh."

