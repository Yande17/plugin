# ============================================================================
#  W2NSMP - messages.yml
#
#  Semua pesan yang dilihat pemain bisa diubah di sini (tanpa restart):
#      /w2nsmp reload
#
#  - Kode warna memakai '&'   (contoh: &a hijau, &c merah, &l bold, &7 abu-abu)
#  - %prefix% diambil dari baris prefix di bawah / config.yml
#  - Placeholder lain: %player% %balance% %amount% %minimum% %seconds%
#    %permission% %usage% %subcommand% %label%
#  - Pesan yang tidak dipakai tidak masalah (boleh dihapus/ditambah di phase nanti)
# ============================================================================

prefix: "&8[&bW2NSMP&8] &r"

# --- Pesan umum command ------------------------------------------------------
command:
  no-permission: "%prefix%&cAnda tidak memiliki izin &f%permission%&c."
  player-only: "%prefix%&cPerintah ini hanya dapat dijalankan oleh pemain."
  unknown-subcommand: "%prefix%&cSubcommand &f%subcommand% &ctidak dikenal. Gunakan &f/%label% help&c."
  reload-success: "%prefix%&aKonfigurasi dimuat ulang &7(config, messages, ekonomi)&a."
  reload-failed: "%prefix%&cGagal memuat ulang konfigurasi. Cek console untuk detailnya."

# --- Header GUI / daftar command --------------------------------------------
help:
  header: "%prefix%&bDaftar perintah W2NSMP"
  footer: "&7Gunakan &f/%label% help &7kapan saja."
  admin-header: "%prefix%&cPerintah admin"
  balance: "&f/saldo &8(&7atau &f/w2nsmp:balance&8) &7- melihat saldo Anda"
  pay: "&f/bayar <pemain> <jumlah> &7- mengirim uang ke pemain lain"
  sell: "&f/jual &8(&7atau &f/w2nsmp:sell&8) &7- menjual item ke server lewat GUI"
  home: "&f/home &8(&7atau &f/w2nsmp:home&8) &7- membuka menu home (GUI)"
  sethome: "&f/sethome <nama> &8(&7atau &f/w2nsmp:sethome&8) &7- menyimpan lokasi sebagai home"
  delhome: "&f/delhome <nama> &8(&7atau &f/w2nsmp:delhome&8) &7- menghapus home"
  rtp: "&f/rtp &8(&7atau &f/wild&8) &7- teleport ke lokasi acak yang aman"
  auction: "&f/ah &8(&7atau &f/w2nsmp:ah&8) &7- auction house (jual & beli item antar pemain)"
  worth: "&f/harga &8(&7atau &f/worth&8) &7- melihat harga jual item (lore harga ikut tampil di item)"
  top: "&f/top [kategori] &8(&7atau &f/w2nsmp:top&8) &7- daftar peringkat pemain (GUI, juga &f/top chat&7)"
  scoreboard: "&f/sb &8(&7atau &f/scoreboard&8) &7- menyalakan/mematikan sidebar statistik pribadi"
  profile: "&f/profile [pemain] [chat] &7- profil pemain (GUI: uang, statistik, home, bounty)"
  setting: "&f/setting &7- pengaturan pribadi (sidebar, baris sidebar, nametag uang, bunyi, notifikasi)"
  skill: "&f/skill &8(&7atau &f/keahlian&8) &7- level & buff skill (fighting, mining, farming, ...)"
  rod: "&f/rod &8(&7atau &f/pancingan&8) &7- GUI rod pancing (level, upgrade, attachment, v1.4.0)"
  fish: "&f/fish &8(&7atau &f/ikan&8) &7- Fishing Hub: galeri ikan & rod (v1.4.1)"
  tpa: "&f/tpa [pemain] &7- GUI permintaan teleport antar-pemain"
  tpahere: "&f/tpahere <pemain> &7- meminta pemain lain teleport ke lokasimu"
  tpaccept: "&f/tpaccept [pemain] &7- menerima permintaan teleport"
  tpdeny: "&f/tpdeny [pemain] &7- menolak permintaan teleport"
  tpacancel: "&f/tpacancel [pemain] &7- membatalkan permintaan teleport yang dikirim"
  bounty: "&f/bounty [pemain] [jumlah] &7- daftar bounty & memasang hadiah buruan (GUI)"

# --- Economy -----------------------------------------------------------------
