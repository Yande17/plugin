# =============================================================================================
# SKILL (/skill) - 11 skill, tiap skill punya beberapa buff bertahap (v1.3.0)
# =============================================================================================
# Placeholder yang tersedia (tergantung pesan):
#   %player% %skill% %key% %level% %max% %next-level% %xp% %xp-into% %xp-needed%
#   %xp-to-next% %percent% %bar% %buff% %buff-desc% %source% %unlock% %total-xp% %total-level%
#   %buffs% %buff-count% %buffs-unlocked% %next-buff% %next-buff-level%
# Khusus kartu buff & menu progres:
#   %buff% (nama buff) %buff-value% %buff-kind% %per% %max% %power% %value% %cap-level% %amp-next%
# Khusus peringkat (top): %rank% %rank-total% %scope% %count% %limit% %player%
skill:
  disabled: "%prefix%&cThe skill feature is currently disabled."
  no-skills: "%prefix%&7No skills are enabled on this server."
  player-only: "%prefix%&cOnly players can use that command. Try &f%hint%&c."
  skill-disabled: "%prefix%&7The skill &f%skill% &7is currently disabled."
  unknown-skill: "%prefix%&cUnknown skill &f%input%&c. Options: &f%list%&c."
  invalid-number: "%prefix%&cInvalid number: &f%input%&c."
  target-not-found: "%prefix%&cPlayer &f%player% &cnot found (must be online)."
  all-skills: "all skills"
  extra-drop: "%prefix%&aYour &f%skill% &abuff granted an extra drop!"
  usage-info: "%prefix%&cUsage: &f/skill info <player> [skill]"
  usage-set: "%prefix%&cUsage: &f/skill set <player> <skill> <level>"
  usage-add: "%prefix%&cUsage: &f/skill add <player> <skill> <xp>"
  usage-reset: "%prefix%&cUsage: &f/skill reset <player> [skill]"
  actionbar: "&7%skill% &8+&a%xp% XP &8(&7Lv. &f%level%&8)"
  # Dipakai bila buff double-xp sedang beruntung (XP yang masuk dua kali lipat).
  actionbar-double: "&7%skill% &8+&a%xp% XP &6x2 &8(&7Lv. &f%level%&8)"
  # Serangan critical (buff crit-chance fighting/archery) - hanya di action bar.
  crit: "&6» CRITICAL &8| &7%skill% &f%damage% damage &8(&6+%power%%&8)"
  # Loot mob ganda (buff mob-loot). Dipakai bila skills.notify-extra-drop: true.
  mob-loot: "%prefix%&aYour &f%skill% &abuff duplicated a mob drop!"
  level-up: "%prefix%&a%skill% &7leveled up to &f%level%&7/&f%max% &8| &7buff: %buff%"
  # Dikirim terpisah bila pada level itu ada buff baru yang terbuka (hapus kunci ini untuk mematikan).
  level-up-buff: "%prefix%&6New buff unlocked &8| &f%buff% &8(&7%desc%&8) &7value: %buff-value%"
  # Karakter bar kemajuan (%bar%).
  bar-filled: "&a|"
  bar-empty: "&8|"
  # Nilai buff siap tampil. %value% diisi oleh plugin sesuai jenis buff.
  buff-value:
    format: "&a%value%"
    none: "&8-"
    locked: "&8(unlocks at Lv. &f%level%&8)"
    disabled: "&8(disabled by admin)"
    # Ditampilkan bila API server tidak mendukung buff itu (lihat log "Skill:" saat startup).
    unavailable: "&8(not supported on this server)"
    haste: "&bHaste %level%"
    # Buff potion generik (absorption, fire resistance, ...): %name% %level% (angka Romawi).
    potion: "&b%name% %level%"
    heal: "&c+%amount% heart / %seconds%s"
    # Buff peluang yang punya kekuatan tambahan (critical/block): %value% + %power%.
    power: "&a%value% &8(&7+%power%&8)"
  # Nama skill (dipakai di GUI, chat, dan pesan level-up).
  name:
    fighting: "Fighting"
    defense: "Defense"
    archery: "Archery"
    agility: "Agility"
    mining: "Mining"
    woodcutting: "Woodcutting"
    farming: "Farming"
    fishing: "Fishing"
    endurance: "Endurance"
    vitality: "Vitality"
    recovery: "Recovery"
  # Penjelasan buff menurut jenisnya (skill.buff.<jenis-buff>).
  buff:
    damage-melee: "Increases your melee damage."
    damage-projectile: "Increases your arrow/projectile damage."
    crit-chance: "Chance to land a critical hit (extra damage)."
    damage-reduction: "Reduces the damage you take."
    block-chance: "Chance to block part of an incoming hit."
    environment-reduction: "Reduces environmental damage (fall, fire, drowning, ...)."
    walk-speed: "Increases your walking speed."
    haste: "Mine faster (Haste effect)."
    potion: "Permanent bonus potion effect while unlocked."
    extra-drop: "Chance to get an extra drop when chopping/harvesting."
    extra-catch: "Chance to catch a double haul while fishing."
    mob-loot: "Chance to duplicate a mob drop when you get the kill."
    vanilla-xp: "Extra vanilla XP from mined ores."
    double-xp: "Chance for incoming skill XP to be doubled."
    passive-heal: "Slowly regenerate health while out of combat."
    regen-boost: "Strengthens natural regeneration."
  # Nama pendek buff untuk lore GUI & daftar buff (skill.buff-short.<jenis-buff>).
