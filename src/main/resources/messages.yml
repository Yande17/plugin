  pay-success: "%prefix%&aAnda mengirim &f%amount% &akepada &f%player%&a."
  pay-received: "%prefix%&aAnda menerima &f%amount% &adari &f%player%&a."

# --- SELL GUI (PHASE 3) ------------------------------------------------------
