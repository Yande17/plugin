# =============================================================================================
# SKILL (/skill) - 11 skill, tiap skill punya beberapa buff bertahap (v1.3.0)
# =============================================================================================
# Placeholder yang tersedia (tergantung pesan):
#   %player% %skill% %key% %level% %max% %next-level% %xp% %xp-into% %xp-needed%
#   %xp-to-next% %percent% %bar% %buff% %buff-desc% %source% %unlock% %total-xp% %total-level%
#   %buffs% %buff-count% %buffs-unlocked% %next-buff% %next-buff-level%
# Khusus kartu buff & menu progres:
#   %buff% (nama buff) %buff-value% %buff-kind% %per% %max% %power% %value% %cap-level% %amp-next%
# Khusus peringkat (top): %rank% %rank-total% %scope% %count% %limit% %player%
skill:
  disabled: "%prefix%&cFitur skill sedang dinonaktifkan admin."
  no-skills: "%prefix%&7Tidak ada skill yang aktif di server ini."
  player-only: "%prefix%&cHanya pemain yang bisa memakai perintah itu. Coba &f%hint%&c."
  skill-disabled: "%prefix%&7Skill &f%skill% &7sedang dimatikan admin."
  unknown-skill: "%prefix%&cSkill &f%input% &ctidak dikenal. Pilihan: &f%list%&c."
  invalid-number: "%prefix%&cAngka tidak valid: &f%input%&c."
  target-not-found: "%prefix%&cPemain &f%player% &ctidak ditemukan (perlu sedang online)."
  all-skills: "semua skill"
  extra-drop: "%prefix%&aBuff &f%skill% &amemberi hasil tambahan!"
  usage-info: "%prefix%&cPenggunaan: &f/skill info <pemain> [skill]"
  usage-set: "%prefix%&cPenggunaan: &f/skill set <pemain> <skill> <level>"
  usage-add: "%prefix%&cPenggunaan: &f/skill add <pemain> <skill> <xp>"
  usage-reset: "%prefix%&cPenggunaan: &f/skill reset <pemain> [skill]"
  actionbar: "&7%skill% &8+&a%xp% XP &8(&7Lv. &f%level%&8)"
  # Dipakai bila buff double-xp sedang beruntung (XP yang masuk dua kali lipat).
  actionbar-double: "&7%skill% &8+&a%xp% XP &6x2 &8(&7Lv. &f%level%&8)"
  # Serangan critical (buff crit-chance fighting/archery) - hanya di action bar.
  crit: "&6» CRITICAL &8| &7%skill% &f%damage% damage &8(&6+%power%%&8)"
  # Loot mob ganda (buff mob-loot). Dipakai bila skills.notify-extra-drop: true.
  mob-loot: "%prefix%&aBuff &f%skill% &amenggandakan satu drop mob!"
  level-up: "%prefix%&a%skill% &7naik ke level &f%level%&7/&f%max% &8| &7buff: %buff%"
  # Dikirim terpisah bila pada level itu ada buff baru yang terbuka (hapus kunci ini untuk mematikan).
  level-up-buff: "%prefix%&6Buff baru terbuka &8| &f%buff% &8(&7%desc%&8) &7nilai: %buff-value%"
  # Karakter bar kemajuan (%bar%).
  bar-filled: "&a|"
  bar-empty: "&8|"
  # Nilai buff siap tampil. %value% diisi oleh plugin sesuai jenis buff.
  buff-value:
    format: "&a%value%"
    none: "&8-"
    locked: "&8(buka di Lv. &f%level%&8)"
    disabled: "&8(dimatikan admin)"
    # Ditampilkan bila API server tidak mendukung buff itu (lihat log "Skill:" saat startup).
    unavailable: "&8(tidak didukung server ini)"
    haste: "&bHaste %level%"
    # Buff potion generik (absorption, fire resistance, ...): %name% %level% (angka Romawi).
    potion: "&b%name% %level%"
    heal: "&c+%amount% heart / %seconds% dtk"
    # Buff peluang yang punya kekuatan tambahan (critical/block): %value% + %power%.
    power: "&a%value% &8(&7+%power%&8)"
  # Nama skill (dipakai di GUI, chat, dan pesan level-up).
  name:
    fighting: "Pertarungan"
    defense: "Pertahanan"
    archery: "Memanah"
    agility: "Ketangkasan"
    mining: "Menambang"
    woodcutting: "Menebang Kayu"
    farming: "Bertani"
    fishing: "Memancing"
    endurance: "Daya Tahan"
    vitality: "Vitalitas"
    recovery: "Pemulihan"
  # Penjelasan buff menurut jenisnya (skill.buff.<jenis-buff>).
  buff:
    damage-melee: "Damage serangan jarak dekat bertambah."
    damage-projectile: "Damage panah/proyektil bertambah."
    crit-chance: "Peluang serangan menjadi critical (damage lebih besar)."
    damage-reduction: "Damage yang diterima berkurang."
