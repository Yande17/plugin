# ============================================================================
#  W2NSMP - prices.yml
#
#  Harga jual item ke server (dipakai oleh GUI /sell).
#
#  ATURAN:
#    - Harga HARUS angka bulat (integer), tanpa desimal.
#    - Harga 0 atau baris dihapus = item TIDAK dijual ke server.
#    - Nama item memakai nama Material Bukkit (huruf besar), contoh: DIAMOND.
#    - Setelah mengubah file ini jalankan:  /w2nsmp reload
#      (atau ubah langsung dari dalam game: /w2nsmp setprice <item> <harga>)
#
#  Bentuk penulisan yang diterima:
#      DIAMOND:
#        sell: 250
#      COBBLESTONE: 2        # bentuk singkat, juga boleh
# ============================================================================

